services:
  transit-hub-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEBSITE_HTTP_PORT:-80}:80"
    networks:
      - transit-hub-net
    restart: unless-stopped

networks:
  transit-hub-net:
    external: true
