services:
  transit-hub-website:
    image: transit-hub-website
    container_name: transit-hub-website
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_BASE_URL: ${VITE_BASE_URL:-/}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      NGINX_BASE_URL: ${NGINX_BASE_URL:-}
      NGINX_API_BASE_URL: ${NGINX_API_BASE_URL:-}
      TRANSIT_HUB_UPSTREAM: ${TRANSIT_HUB_UPSTREAM:-}
    ports:
      - "${WEBSITE_HTTP_PORT:-80}:80"
    networks:
      - transit-hub-net
    restart: unless-stopped

networks:
  transit-hub-net:
    external: true
